version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://notes_user:mysecretpassword@db:5432/notes_db
    depends_on:
      - db

volumes:
  postgres_data: